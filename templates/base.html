<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Portfolio of Rajwa Nuwayyar Saif Lawahidz - Web Developer & Designer. Crafting digital products that are clear, usable, and conversion focused.">
    <title>{% block title %}Rajwa Nuwayyar Saif Lawahidz — Portfolio{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>

<body class="page-transition-body">
    <!-- Cloud Background -->
    <div class="cloud-bg" id="cloud-bg"></div>

    <!-- Main Container -->
    <div class="main-container" id="main-container">

        <!-- Navigation Bar -->
        <nav class="navbar" id="navbar">
            <div class="nav-left">
                <a href="/" class="status-badge">
                    <span class="status-dot"></span>
                    <span>HOME</span>
                </a>
            </div>
            <div class="nav-center">
                <a href="/work"
                    class="nav-link {% if request.path.startswith('/work') or request.path.startswith('/project') %}active{% endif %}">Work
                    <span class="nav-count">[4]</span></a>
                <a href="/service"
                    class="nav-link {% if request.path.startswith('/service') %}active{% endif %}">Service <span
                        class="nav-count">[4]</span></a>
                <a href="/experience"
                    class="nav-link {% if request.path.startswith('/experience') %}active{% endif %}">Experience <span
                        class="nav-count">[9+Y]</span></a>
                <a href="/contact"
                    class="nav-link {% if request.path.startswith('/contact') %}active{% endif %}">Contact</a>
            </div>
            <div class="nav-right">
                <a href="/contact" class="btn-lets-talk" id="btn-lets-talk">Let's Talk <span class="arrow">↗</span></a>
            </div>
        </nav>

        <!-- Page View Wrapper -->
        <main class="page-content-wrapper" id="page-content">
            {% block content %}{% endblock %}
        </main>

        <!-- Global Footer (on subpages) -->
        {% block footer %}
        <footer class="global-footer">
            <div class="footer-socials" id="footer-socials">
                <a href="/" class="footer-social-btn name-badge" id="footer-name">
                    <img src="/assets/images/Foto.png" alt="Rajwa" class="footer-avatar">
                    Rajwa Nuwayyar
                </a>
                <a href="https://www.instagram.com/rajwa_nxl/" target="_blank" class="footer-social-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="2" width="20" height="20" rx="5" />
                        <circle cx="12" cy="12" r="5" />
                        <circle cx="17.5" cy="6.5" r="1.5" />
                    </svg>
                    Instagram
                </a>
                <a href="https://api.whatsapp.com/send/?phone=6285729959997&text&type=phone_number&app_absent=0"
                    target="_blank" class="footer-social-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
                    </svg>
                    WhatsApp
                </a>
                <a href="https://github.com/RajwaNuwayyar" target="_blank" class="footer-social-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" />
                    </svg>
                    GitHub
                </a>
                <a href="https://www.linkedin.com/in/rajwa-nuwayyar-saif-lawahidz-3840b442b/" target="_blank"
                    class="footer-social-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
                        <rect x="2" y="9" width="4" height="12" />
                        <circle cx="4" cy="4" r="2" />
                    </svg>
                    LinkedIn
                </a>
                <a href="https://www.tiktok.com/@rajwa_nxl?_r=1&_t=ZS-990VGof8GLX" target="_blank"
                    class="footer-social-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5" />
                    </svg>
                    TikTok
                </a>
                <a href="https://www.facebook.com/share/1C8vztQ2y2/" target="_blank" class="footer-social-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
                    </svg>
                    Facebook
                </a>
            </div>
        </footer>
        {% endblock %}

    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
